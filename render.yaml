databases:
  - name: meal-tracker-db
    plan: free
    databaseName: meal_tracker_production
    user: meal_tracker_user

services:
  - type: web
    name: meal-tracker
    runtime: ruby
    plan: free
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meal-tracker-db
          property: connectionURI
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_LOG_TO_STDOUT
        value: "1"
